# ==========================================================
# Customer Churn ANN Configuration
# ==========================================================

project:
  name: Customer Churn ANN Prediction

paths:
  raw_data: data/customer_churn.csv

  model_dir: artifacts/model

  preprocessor_dir: artifacts/preprocessor

  report_dir: artifacts/reports

training:
  epochs: 100

  batch_size: 32

  learning_rate: 0.001

  validation_split: 0.20

  random_state: 42

model:
  hidden_layers:
    - 128
    - 64
    - 32
    - 16
    - 8

  activation: relu

  output_activation: sigmoid

  dropout:
    - 0.30
    - 0.20
    - 0.00

callbacks:
  early_stopping:
    monitor: val_loss

    patience: 10

    restore_best_weights: true

  reduce_lr:
    monitor: val_loss

    factor: 0.2

    patience: 5

    min_lr: 0.00001

  checkpoint:
    monitor: val_loss

    save_best_only: true

data_ingestion:
  raw_data_path: data/customer_churn.csv

  train_data_path: artifacts/train.csv

  test_data_path: artifacts/test.csv

  test_size: 0.20

  random_state: 42

  target_column: Churned

preprocessing:
  numerical_scaler: standard

  categorical_encoder: onehot

  drop_first: false
